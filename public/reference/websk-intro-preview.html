<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Websk — intro preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#02030c; --ink:#ffffff; --muted:#9ea2c0; --dim:#6a6e90; --line:#22254a; --accent:#6D3BFF;
  --serif:"Marcellus", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#02030c; --ink:#ffffff; --muted:#9ea2c0; --dim:#6a6e90; --line:#22254a; } }
:root[data-theme="dark"]{ --bg:#02030c; --ink:#ffffff; --muted:#9ea2c0; --dim:#6a6e90; --line:#22254a; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}

/* space background: deep black + faint nebula glows + stars */
.space{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(120% 90% at 50% 120%, #0a0b2a 0%, #03040f 55%, #010208 100%)}
.space::before{content:"";position:absolute;inset:-20%;pointer-events:none;
  background:
   radial-gradient(38% 34% at 18% 24%, rgba(109,59,255,.20), transparent 70%),
   radial-gradient(34% 30% at 82% 68%, rgba(59,43,224,.18), transparent 70%),
   radial-gradient(30% 26% at 55% 105%, rgba(109,59,255,.14), transparent 70%),
   radial-gradient(22% 18% at 75% 12%, rgba(120,90,255,.08), transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}
.space::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%)}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,1.5%,0) scale(1.08)}}
.stars{position:absolute;inset:0;width:100%;height:100%;display:block}

.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:transform 1s cubic-bezier(.76,0,.24,1)}
.loader.done{transform:translateY(-100%)}
.stack{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:min(92vw,520px);text-align:center}
.sig{width:clamp(200px,34vw,340px);height:auto;display:block;filter:drop-shadow(0 0 18px rgba(140,110,255,.35));
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 42%,transparent 58%);
          mask-image:linear-gradient(90deg,#000 0%,#000 42%,transparent 58%);
  -webkit-mask-size:260% 100%; mask-size:260% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:100% 0; mask-position:100% 0}
.play .sig{animation:write 1.9s cubic-bezier(.45,.05,.3,1) .15s forwards}
@keyframes write{to{-webkit-mask-position:0 0;mask-position:0 0}}
.tag{margin-top:clamp(18px,3vh,30px);min-height:4.4em;font-size:clamp(16px,2.1vw,21px);line-height:1.5;letter-spacing:.01em}
.tag span{display:block;opacity:0;transform:translateY(8px);color:var(--muted)}
.play .tag span:nth-child(1){animation:up .9s ease 1.6s forwards}
.play .tag span:nth-child(2){animation:up .9s ease 2.3s forwards}
@keyframes up{to{opacity:1;transform:none}}
.bar{margin-top:clamp(18px,3vh,30px);width:min(220px,50vw);height:1px;background:var(--line);position:relative;overflow:hidden;opacity:0}
.play .bar{animation:fade .6s ease .9s forwards}
.fill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,transparent,#c9c6ff 70%,#fff)}
@keyframes fade{to{opacity:1}}
.meta{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);opacity:0}
.play .meta{animation:fade .6s ease 1s forwards}
.status{margin-top:18px;font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);opacity:0;height:1.2em}
.play .status{animation:fade .6s ease 1s forwards}
.status.swap{opacity:.25 !important;transition:opacity .25s}
.after{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px}
.after .copy{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}
.after h1{font-weight:400;font-size:clamp(28px,5vw,56px);letter-spacing:-.01em}
.after p{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.replay{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:5;background:rgba(2,3,12,.5);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
.replay:hover{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){
  .sig{-webkit-mask-image:none;mask-image:none}
  .space::before{animation:none}
  .tag span,.bar,.meta,.status{opacity:1;transform:none;animation:none !important}
}
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- starfield ---------- */
  function Stars(canvas, opts){
    var ctx=canvas.getContext('2d'), stars=[], shoots=[], w=0, h=0, dpr=1, raf=0, last=0, nextShoot=2200, running=false;
    var tints=['255,255,255','255,255,255','205,215,255','225,205,255'];
    function build(){
      var n=Math.max(90,Math.min(Math.round(w*h/5200),340)); stars=[];
      for(var i=0;i<n;i++){
        var big=Math.random()>.88;
        stars.push({x:Math.random()*w,y:Math.random()*h,z:.35+Math.random()*.65,
          r:big?1.1+Math.random()*.9:.35+Math.random()*.75,tw:Math.random()*6.28,sp:.5+Math.random()*1.6,
          c:tints[(Math.random()*tints.length)|0]});
      }
    }
    function resize(){
      dpr=Math.min(window.devicePixelRatio||1,2); w=canvas.clientWidth; h=canvas.clientHeight;
      canvas.width=Math.max(1,w*dpr); canvas.height=Math.max(1,h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); build(); draw(0,0);
    }
    function draw(t,dt){
      ctx.clearRect(0,0,w,h);
      for(var i=0;i<stars.length;i++){
        var s=stars[i];
        if(!reduce){ s.x-=.006*dt*s.z; if(s.x<-2) s.x=w+2; }
        var a=(.3+.7*(.5+.5*Math.sin(t*.001*s.sp+s.tw)))*(.45+.55*s.z);
        ctx.fillStyle='rgba('+s.c+','+a.toFixed(3)+')';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
        if(s.r>1.1){ ctx.fillStyle='rgba('+s.c+','+(a*.14).toFixed(3)+')'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*3.2,0,6.283); ctx.fill(); }
      }
      for(var j=shoots.length-1;j>=0;j--){
        var m=shoots[j]; m.age+=dt; var k=m.age/m.life;
        if(k>=1){ shoots.splice(j,1); continue; }
        m.x+=m.vx*dt/1000; m.y+=m.vy*dt/1000;
        var tx=m.x-m.vx*.09, ty=m.y-m.vy*.09, g=ctx.createLinearGradient(m.x,m.y,tx,ty);
        var al=(1-k)*.9; g.addColorStop(0,'rgba(255,255,255,'+al+')'); g.addColorStop(1,'rgba(160,130,255,0)');
        ctx.strokeStyle=g; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();
      }
    }
    function loop(now){
      if(!running) return;
      var dt=Math.min(now-(last||now),50); last=now;
      if(opts.shoot && !reduce){ nextShoot-=dt; if(nextShoot<=0){ nextShoot=2600+Math.random()*3200;
        shoots.push({x:Math.random()*w*.8+w*.15,y:Math.random()*h*.35,vx:-520-Math.random()*260,vy:300+Math.random()*180,life:900,age:0}); } }
      draw(now,dt); raf=requestAnimationFrame(loop);
    }
    this.start=function(){ if(reduce||running) return; running=true; last=0; raf=requestAnimationFrame(loop); };
    this.stop=function(){ running=false; cancelAnimationFrame(raf); };
    window.addEventListener('resize',resize); resize();
  }
  var starsLoader=new Stars(document.getElementById('starsLoader'),{shoot:true});
  var starsAfter=new Stars(document.getElementById('starsAfter'),{shoot:false});
  starsLoader.start(); starsAfter.start();

  /* ---------- intro timeline ---------- */
  var loader=document.getElementById('loader'), fill=document.getElementById('fill'),
      pct=document.getElementById('pct'), status=document.getElementById('status');
  var msgs=[[0,'Setting up the canvas'],[28,'Writing clean code'],[55,'Tuning performance'],[80,'Polishing the details'],[96,'Ready']];
  var raf, t0, DUR=4600, DELAY=900, cur=-1;
  function ease(x){ return x<.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
  function setMsg(i){
    if(i===cur) return; cur=i;
    status.classList.add('swap');
    setTimeout(function(){ status.textContent=msgs[i][1]; status.classList.remove('swap'); },220);
  }
  function tick(now){
    if(!t0) t0=now;
    var p=Math.min(Math.max((now-t0-DELAY)/DUR,0),1), e=ease(p), n=Math.round(e*100);
    fill.style.transform='scaleX('+e+')';
    pct.textContent='Loading '+String(n).padStart(2,'0')+'%';
    for(var i=msgs.length-1;i>=0;i--){ if(n>=msgs[i][0]){ setMsg(i); break; } }
    if(p<1){ raf=requestAnimationFrame(tick); }
    else { setTimeout(function(){ loader.classList.add('done'); },500); }
  }
  function play(){
    cancelAnimationFrame(raf); t0=0; cur=-1;
    loader.classList.remove('done','play'); void loader.offsetWidth;
    fill.style.transform='scaleX(0)'; pct.textContent='Loading 00%'; status.textContent=msgs[0][1];
    starsLoader.start(); loader.classList.add('play'); raf=requestAnimationFrame(tick);
  }
  document.getElementById('replay').addEventListener('click',play);
  if(reduce){
    fill.style.transform='scaleX(1)'; pct.textContent='Loading 100%'; status.textContent='Ready';
    setTimeout(function(){ loader.classList.add('done'); },1200);
  } else { play(); }
})();
</script>
</body>
</html>
